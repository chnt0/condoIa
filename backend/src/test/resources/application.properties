# Test configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# H2 database configuration for tests - use PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=jsonb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Enable hibernate physical naming strategy to use lowercase with underscores
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# JWT configuration for tests
jwt.secret=test-secret-key-for-unit-tests-only-not-for-production-use
jwt.access-token.expiration=3600000
jwt.refresh-token.expiration=86400000
# CORS configuration for tests
cors.allowed-origins=http://localhost:3000
