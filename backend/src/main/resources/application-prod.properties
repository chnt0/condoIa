# Perfil de producción — activo con: SPRING_PROFILES_ACTIVE=prod
# Todas las variables sensibles deben venir de variables de entorno del servidor
spring.jpa.show-sql=false
logging.level.com.condos=WARN
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=ERROR

# Forzar HTTPS en headers de respuesta (cuando hay proxy nginx/caddy)
server.forward-headers-strategy=framework
